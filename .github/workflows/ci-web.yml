name: CI - WebAssembly
on:
  push:
    branches: [main]
    paths: ['core/**', 'platforms/web/**', 'scripts/web/**', 'package.json', '.github/workflows/ci-web.yml']
  pull_request:
    paths: ['core/**', 'platforms/web/**', 'scripts/web/**', 'package.json', '.github/workflows/ci-web.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.12
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.12
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Install Ninja
        run: brew list ninja || brew install ninja
      - run: npm run build:web
      - run: npm run test:web
      - name: Pack distribution
        run: npm pack ./platforms/web --pack-destination platforms/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: agenui-web-${{ github.sha }}
          path: |
            platforms/web/dist/
            platforms/web/example/
          retention-days: 7
